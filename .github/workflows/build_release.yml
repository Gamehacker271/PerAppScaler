name: Build & Release PerAppScaler

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Magisk Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Package Magisk / KernelSU Module
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" magisk_module/system/priv-app/PerAppScaler/PerAppScaler.apk
          cp "$APK_PATH" PerAppScaler-v1.0.0.apk
          
          cd magisk_module
          zip -r9 ../PerAppScaler-v1.0.0-MagiskModule.zip ./*
          cd ..
          ls -lh PerAppScaler-v1.0.0.apk PerAppScaler-v1.0.0-MagiskModule.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PerAppScaler-Release-Package
          path: |
            PerAppScaler-v1.0.0.apk
            PerAppScaler-v1.0.0-MagiskModule.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "PerAppScaler v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## PerAppScaler v1.0.0
            
            Open-source per-application resolution scaling and FPS tuning tool for Android 12 through Android 17+.
            
            ### Included in this Release:
            - **`PerAppScaler-v1.0.0.apk`**: Standalone signed APK.
            - **`PerAppScaler-v1.0.0-MagiskModule.zip`**: Magisk / KernelSU / APatch flashable module providing native privileged system app placement (`/system/priv-app/`) with `MANAGE_GAME_MODE` permission whitelist.
            
            ### Features:
            - **Zero root needed at runtime** when installed as `priv-app`.
            - Hardware scaling via SurfaceFlinger & Qualcomm/MediaTek DPU.
            - Multi-language support: English, Spanish, Portuguese, Indonesian, Vietnamese, Russian, Simplified Chinese, Traditional Chinese, Arabic (RTL).
            - Custom resolution scale (30% to 100%) and target FPS limits (30, 45, 60, 90, 120, uncapped).
          files: |
            PerAppScaler-v1.0.0.apk
            PerAppScaler-v1.0.0-MagiskModule.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
