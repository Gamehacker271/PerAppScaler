name: Build & Release PerAppScaler

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Magisk Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Package Magisk / KernelSU Module
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          mkdir -p magisk_module/system/priv-app/PerAppScaler
          cp "$APK_PATH" magisk_module/system/priv-app/PerAppScaler/PerAppScaler.apk
          cp "$APK_PATH" PerAppScaler-v1.0.2.apk
          cp permissions/privapp-permissions-com.gamehac.perappscaler.xml privapp-permissions-com.gamehac.perappscaler.xml
          
          cd magisk_module
          zip -r9 ../PerAppScaler-v1.0.2-MagiskModule.zip ./*
          cd ..
          ls -lh PerAppScaler-v1.0.2.apk PerAppScaler-v1.0.2-MagiskModule.zip privapp-permissions-com.gamehac.perappscaler.xml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PerAppScaler-Release-Package
          path: |
            PerAppScaler-v1.0.2.apk
            PerAppScaler-v1.0.2-MagiskModule.zip
            privapp-permissions-com.gamehac.perappscaler.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.2
          name: "PerAppScaler v1.0.2"
          draft: false
          prerelease: false
          body: |
            ## PerAppScaler v1.0.2
            
            Open-source per-application resolution scaling and FPS tuning tool for Android 12 through Android 17+.
            
            ### Included in this Release:
            - **`PerAppScaler-v1.0.2.apk`**: Standalone signed APK.
            - **`PerAppScaler-v1.0.2-MagiskModule.zip`**: Magisk / KernelSU / APatch flashable module providing native privileged system app placement (`/system/priv-app/`) with full priv-app permissions whitelist.
            - **`privapp-permissions-com.gamehac.perappscaler.xml`**: Privileged permissions XML for ROM builders (`/product/etc/permissions/` or `/system/etc/permissions/`).
            
            ### Changes in v1.0.2:
            - Added `IPlatformCompat` (`DOWNSCALED` + `DOWNSCALE_XX`) support so resolution scaling works on **all regular apps** (not only `CATEGORY_GAME` apps), including Android 17 `user` builds via `putOverridesOnReleaseBuilds`.
            - Added `FORCE_STOP_PACKAGES` privileged permission and `ActivityManager.forceStopPackage` reflection so target apps/games restart cleanly without needing root.
            - Fixed silent-failure bug where failed interventions were still reported as applied.
            - Added `am compat` root shell fallback alongside `cmd game`.
          files: |
            PerAppScaler-v1.0.2.apk
            PerAppScaler-v1.0.2-MagiskModule.zip
            privapp-permissions-com.gamehac.perappscaler.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
